name: Daily Letter-to-the-Universe Reel

on:
  schedule:
    # 14:00 UTC every day — adjust to whenever your audience is most active
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
        # ffmpeg is already preinstalled on GitHub's ubuntu-latest runners

      - name: Fetch current letter count
        id: count
        run: echo "value=$(python3 fetch_count.py)" >> "$GITHUB_OUTPUT"

      - name: Render today's reel
        run: |
          mkdir -p reels
          TODAY=$(date -u +%F)
          python3 generate_reel.py \
            --count ${{ steps.count.outputs.value }} \
            --quote-index auto \
            --output reels/reel-${TODAY}.mp4

      - name: Commit rendered reel
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add reels/
          git commit -m "Daily reel $(date -u +%F)" || echo "nothing to commit"
          git push
